[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-group9"
version = "0.1.0"
description = "Cross-dataset hybrid next-basket recommender for Instacart and Complete Journey"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.3",
  "scipy==1.13.1",
  "scikit-learn==1.5.2",
  "pyarrow==17.0.0",
  "PyYAML==6.0.2",
  "joblib==1.4.2",
  "matplotlib==3.9.2",
  "seaborn==0.13.2",
]

[project.optional-dependencies]
dev = [
  "jupyterlab==4.2.5",
  "pytest==8.3.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: requires locally prepared sample datasets and model artifacts"]
