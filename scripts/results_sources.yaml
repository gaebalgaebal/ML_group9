# Input registry for scripts/make_results.py (W11). Every path is read-only; nothing here is written.
# Paths are absolute because the inputs live in other git worktrees of C:\dev_ML.
# "stage" wording is fixed: "confirmatory holdout" (PREREG v1.2 final run) or "development medium".

sources:
  holdout:
    stage: confirmatory holdout
    run: holdout
    description: final evaluation, PREREG v1.2 (C:/dev_ML-wt-w4/reports/final, code commit 9d51446)
    files:
      instacart_tuning: C:/dev_ML-wt-w4/reports/final/holdout_instacart_tuning.json
      instacart_eval: C:/dev_ML-wt-w4/reports/final/holdout_instacart_eval.json
      complete_journey_tuning: C:/dev_ML-wt-w4/reports/final/holdout_complete_journey_tuning.json
      complete_journey_eval: C:/dev_ML-wt-w4/reports/final/holdout_complete_journey_eval.json
      complete_journey_eval_transfer: C:/dev_ML-wt-w4/reports/final/holdout_complete_journey_eval_transfer.json
  w4a:
    stage: development medium
    run: W4a
    description: development run of the pre-registered model (backup kept in the W6 worktree, code commit 7baa6a1)
    files:
      instacart_tuning: C:/dev_ML-wt-w6/reports/metrics/_w4_backup/medium_instacart_tuning.json
      instacart_eval: C:/dev_ML-wt-w6/reports/metrics/_w4_backup/medium_instacart_eval.json
      complete_journey_tuning: C:/dev_ML-wt-w6/reports/metrics/_w4_backup/medium_complete_journey_tuning.json
      complete_journey_eval: C:/dev_ML-wt-w6/reports/metrics/_w4_backup/medium_complete_journey_eval.json
      complete_journey_eval_transfer: C:/dev_ML-wt-w6/reports/metrics/_w4_backup/medium_complete_journey_eval_transfer.json
  w6:
    stage: development medium
    run: W6
    description: logistic-regression repeat ranker, C grid [0.01, 0.1, 1, 10] (H6, H7)
    files:
      instacart_tuning: C:/dev_ML-wt-w6/reports/metrics/medium_instacart_tuning.json
      instacart_eval: C:/dev_ML-wt-w6/reports/metrics/medium_instacart_eval.json
      complete_journey_tuning: C:/dev_ML-wt-w6/reports/metrics/medium_complete_journey_tuning.json
      complete_journey_eval: C:/dev_ML-wt-w6/reports/metrics/medium_complete_journey_eval.json
  w7:
    stage: development medium
    run: W7
    description: user-based CF explore list, k grid {20, 50, 100} (H8)
    files:
      instacart_tuning: C:/dev_ML-wt-w7/reports/metrics/medium_instacart_usercf_tuning.json
      instacart_eval: C:/dev_ML-wt-w7/reports/metrics/medium_instacart_usercf_eval.json
      complete_journey_tuning: C:/dev_ML-wt-w7/reports/metrics/medium_complete_journey_usercf_tuning.json
      complete_journey_eval: C:/dev_ML-wt-w7/reports/metrics/medium_complete_journey_usercf_eval.json
  w8:
    stage: development medium
    run: W8
    description: integrated pipeline (LR repeat ranker + user-CF explore, slot re-selection), code commit 24ce85f; backup written by W8b before its run
    optional: true            # skipped with a note when the backup folder does not exist yet
    files:
      instacart_tuning: C:/dev_ML-wt-w8/reports/metrics/_w8_backup/medium_instacart_tuning.json
      instacart_eval: C:/dev_ML-wt-w8/reports/metrics/_w8_backup/medium_instacart_eval.json
      complete_journey_tuning: C:/dev_ML-wt-w8/reports/metrics/_w8_backup/medium_complete_journey_tuning.json
      complete_journey_eval: C:/dev_ML-wt-w8/reports/metrics/_w8_backup/medium_complete_journey_eval.json
  w8b:
    stage: development medium
    run: W8b
    description: re-run of the integrated pipeline (user-CF k grid with 20, --skip-l3); used only once every file carries a commit other than 24ce85f
    optional: true
    complete_when_commit_is_not: "24ce85f"
    files:
      instacart_tuning: C:/dev_ML-wt-w8/reports/metrics/medium_instacart_tuning.json
      instacart_eval: C:/dev_ML-wt-w8/reports/metrics/medium_instacart_eval.json
      complete_journey_tuning: C:/dev_ML-wt-w8/reports/metrics/medium_complete_journey_tuning.json
      complete_journey_eval: C:/dev_ML-wt-w8/reports/metrics/medium_complete_journey_eval.json
  w9:
    stage: development medium
    run: W9
    description: R3 logistic ranker with binned cycle features, module screening (H10)
    files:
      instacart_r3: C:/dev_ML-wt-w9/reports/metrics/medium_instacart_r3.json
      complete_journey_r3: C:/dev_ML-wt-w9/reports/metrics/medium_complete_journey_r3.json
      instacart_overdue_csv: C:/dev_ML-wt-w9/reports/tables/medium_instacart_r3_overdue_coef.csv
      complete_journey_overdue_csv: C:/dev_ML-wt-w9/reports/tables/medium_complete_journey_r3_overdue_coef.csv
      instacart_coefficients_csv: C:/dev_ML-wt-w9/reports/tables/medium_instacart_r3_coefficients.csv
      complete_journey_coefficients_csv: C:/dev_ML-wt-w9/reports/tables/medium_complete_journey_r3_coefficients.csv

eda:
  stage: development medium
  run: W5a
  repo: C:/dev_ML
  branch: feat/w5a-eda
  files:
    - reports/eda/table_datasets.csv
    - reports/eda/fig_history_length.csv
    - reports/eda/fig_repeat_share_by_history.csv
    - reports/eda/fig_new_item_level.csv
    - reports/eda/eda_summary.md

# Which development run feeds the development figures (F2, F3, F4, F5) and T4/T5 when both W8 and W8b exist.
development_integration_run_preference: [W8b, W8]

# Run priority for the T1 "current" flag: within the same stage, dataset, transfer setting, comparator, model and
# metric, the row of the highest-priority run is current (holdout confirmatory > W8b > W9 > W8 > W7, W6 > W4a).
run_priority: {holdout: 0, W8b: 1, W9: 2, W8: 3, W7: 4, W6: 4, W4a: 5}
supersession_notes:
  W4a: "pre-registered model re-run with later code in the integrated pipeline"
  W6: "LR C grid extended to 0.001 and re-run in the integrated pipeline (W8, W8b)"
  W7: "user-CF k grid changed (W8: 50-400, W8b: 20-400) and re-run in the integrated pipeline"
  W8: "user-CF k grid extended with k = 20 (W8b re-run)"
  W9: "same comparison reported by the integrated pipeline"
# List names that denote the same list in different runs (W7 final_ucf = W8 final_star_ucf).
list_aliases: {final_ucf: final_star_ucf}

# Combination labels (fixed by the team, W11 instruction of 2026-11-06). list = name in nbr.pipeline.
combinations:
  C0:    {list: final,          repeat: R1, explore: E1, r_rule: "r = 10 (stage-3 selection)", status: adopted, basis: "H3 (holdout)", note: ""}
  C1:    {list: final_lr,       repeat: R2, explore: E1, r_rule: "r = 10 fixed", status: evaluated-not-adopted, basis: "H7 (medium)", note: ""}
  C2:    {list: final_lr_r,     repeat: R2, explore: E1, r_rule: "r re-selected on the fit split (LR validation users)", status: evaluated-not-adopted, basis: "secondary final_lr_r_vs_final_lr (medium)", note: "r = 10 selected"}
  C3:    {list: final_lr_ucf,   repeat: R2, explore: E2, r_rule: "r re-selected on the fit split (LR validation users)", status: evaluated-not-adopted, basis: "H9 = C3 vs C1 (medium)", note: "r = 10 selected"}
  C3b:   {list: final_star_ucf, repeat: R1, explore: E2, r_rule: "r re-selected on the fit split (all fit users)", status: evaluated-not-adopted, basis: "secondary final_star_ucf_vs_final (medium)", note: "r = 10 selected"}
  C4:    {list: "",             repeat: R2, explore: E3, r_rule: "", status: not run, basis: "", note: "E3 + R2 not implemented"}
  E4+R1: {list: final_cf,       repeat: R1, explore: E4, r_rule: "r = 10 (stage-3 selection)", status: evaluated-not-adopted, basis: "secondary final_cf_vs_final (holdout v1.2 auxiliary)", note: "reference combination"}

# Module catalog (T6). status: adopted = part of the pre-registered model evaluated on the holdout;
# evaluated-not-adopted = evaluated on development data only (adoption decision TBD unless stated);
# excluded = decided against; not-examined = no implementation or evaluation in this project; not run = planned, not implemented.
modules:
  - {id: E1, group: explore, name: "hierarchical explore (theta_u(c), then within-category popularity; L2)", list: explore_star, status: adopted, basis: "H2, H4 (holdout)", note: ""}
  - {id: E2, group: explore, name: "user-based CF (cosine neighbours, k, binary/log1p weighting)", list: usercf, status: evaluated-not-adopted, basis: "H8, H9 (medium)", note: "adoption decision TBD"}
  - {id: E3, group: explore, name: "flat item-CF (item cosine, 20 neighbours)", list: itemcf_flat, status: evaluated-not-adopted, basis: "H5 (holdout, secondary confirmatory)", note: ""}
  - {id: E4, group: explore, name: "theta x item-CF within category", list: explore_cf, status: evaluated-not-adopted, basis: "secondary explore_cf_vs_explore_star (holdout, medium)", note: ""}
  - {id: E5, group: explore, name: "matrix factorisation (MF)", list: "", status: not-examined, basis: "", note: ""}
  - {id: E6, group: explore, name: "product-name tf-idf similarity", list: "", status: not-examined, basis: "", note: ""}
  - {id: E7, group: explore, name: "health-attribute match", list: "", status: not-examined, basis: "", note: ""}
  - {id: E8, group: explore, name: "recent-basket item-CF", list: "", status: not-examined, basis: "", note: ""}
  - {id: flat_pop, group: explore, name: "flat popularity excluding history items (comparator)", list: flat_explore, status: evaluated-not-adopted, basis: "comparator of H2, H5, H8", note: "baseline"}
  - {id: R1, group: repeat, name: "decayed purchase frequency s_rep(gamma*)", list: repeat_star, status: adopted, basis: "H1 (holdout)", note: ""}
  - {id: R2, group: repeat, name: "L2 logistic-regression repeat ranker (12 features)", list: repeat_lr, status: evaluated-not-adopted, basis: "H6, H7 (medium)", note: "adoption decision TBD"}
  - {id: R3, group: repeat, name: "logistic ranker with binned cycle features (30 features)", list: repeat_r3, status: evaluated-not-adopted, basis: "H10 (medium)", note: ""}
  - {id: R4, group: repeat, name: "decision tree repeat ranker", list: "", status: not-examined, basis: "", note: ""}
  - {id: R5, group: repeat, name: "personal purchase frequency (gamma = 1; comparator)", list: repeat_pf, status: evaluated-not-adopted, basis: "comparator of H1", note: "baseline"}
  - {id: R6, group: repeat, name: "recent-N-basket candidate set", list: "", status: not-examined, basis: "", note: ""}

hypothesis_labels:
  H1_repeat_recall: "H1 repeat Recall@10 (R1 vs R5)"
  H2_new_recall: "H2 new-item Recall@10 (E1 vs flat popularity)"
  H3_ndcg: "H3 NDCG@10 (C0 vs personal frequency)"
  H3_recall: "H3 Recall@10 (C0 vs personal frequency)"
  H4_category_hit: "H4 category hit@10"
  H5: "H5 new-item Recall@10 (E3 vs flat popularity; secondary)"
  H6_repeat_recall: "H6 repeat Recall@10 (R2 vs R1)"
  H7_ndcg: "H7 NDCG@10 (C1 vs C0)"
  H7_recall: "H7 Recall@10 (C1 vs C0)"
  H8_new_recall: "H8 new-item Recall@10 (E2 vs flat popularity)"
  H9_ndcg: "H9 NDCG@10 (C3 vs C1)"
  H9_recall: "H9 Recall@10 (C3 vs C1)"
  H10_repeat_recall: "H10 repeat Recall@10 (R3 vs R2)"

dataset_labels:
  instacart: Instacart
  complete_journey: Complete Journey
