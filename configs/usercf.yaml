usercf:
  k: [10, 20, 50, 100, 200, 400]               # W8/W8b extended grid + k=10 (PREREG v1.3 item 7)
  weighting: [binary, log1p]
  block_size: 256
# The base selections (gamma, gamma_c, alpha, r) read by nbr.usercf_eval come from
# <repo>/reports/metrics/<profile>_<dataset>_tuning.json (python -m nbr tune); override with
# the NBR_TUNING_DIR environment variable or --tuning-dir. Bootstrap settings: configs/common.yaml.
