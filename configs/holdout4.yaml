profile: holdout4
role: final                 # Instacart eval split is read once, after selections are fixed on fit splits (PREREG v1.5)
datasets: [instacart]
# Complete Journey has no unused households; the final CJ run uses the medium CJ data (limitation).
complete_journey_profile: medium
# Profile keys replace the same top-level keys of common.yaml (shallow merge), so the blocks below are given in full.
lr_repeat:                                     # as common.yaml, plus the PREREG v1.5 item-CF feature (R2' and C4)
  decay_gammas: [0.5, 0.8, 1.0]
  C: [0.001, 0.01, 0.1, 1.0, 10.0]
  val_fraction: 0.2
  seed: 42
  max_iter: 1000
  itemcf_feature: true                         # fit R2' = R2 + icf (explore.itemcf.neighbors = 20), select r of C4, write the v15 block
bootstrap:
  n: 1000
  seed: 42
  levels: [0.95, 0.975]                        # 95 % and 1 - 0.05/2 (PREREG v1.5 family of 2: H14, H15)
